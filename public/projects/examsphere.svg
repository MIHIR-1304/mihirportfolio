<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="es-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05081c"/>
      <stop offset="50%" stop-color="#0a1238"/>
      <stop offset="100%" stop-color="#030514"/>
    </linearGradient>
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="red-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="es-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Sci-Fi Background -->
  <rect width="800" height="500" fill="url(#es-bg)"/>

  <!-- Radial Glow Behind Backend Modules -->
  <circle cx="400" cy="230" r="190" fill="#1e3a8a" fill-opacity="0.25" filter="url(#es-glow)"/>
  <circle cx="650" cy="180" r="140" fill="#dc2626" fill-opacity="0.12" filter="url(#es-glow)"/>
  <circle cx="150" cy="250" r="120" fill="#06b6d4" fill-opacity="0.15" filter="url(#es-glow)"/>

  <!-- Grid Pattern -->
  <g stroke="#3b82f6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="550" y1="0" x2="550" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Title Top Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="680" height="48" rx="10" fill="#0e1740" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2"/>
    <circle cx="25" cy="24" r="5" fill="#38bdf8" filter="url(#es-glow)"/>
    <text x="42" y="29" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="extrabold" letter-spacing="1">EXAMSPHERE</text>
    <text x="175" y="29" fill="#94a3b8" font-family="sans-serif" font-size="12">| Scalable Modular-Monolith Architecture</text>

    <!-- Right Tags -->
    <rect x="490" y="12" width="75" height="24" rx="5" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="527" y="27" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="10" font-weight="bold">PostgreSQL</text>

    <rect x="575" y="12" width="55" height="24" rx="5" fill="#dc2626" fill-opacity="0.25" stroke="#f87171" stroke-width="0.8"/>
    <text x="602" y="27" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold">Redis</text>
    
    <rect x="638" y="12" width="35" height="24" rx="5" fill="#16a34a" fill-opacity="0.25" stroke="#4ade80" stroke-width="0.8"/>
    <text x="655" y="27" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="9" font-weight="bold">SRS</text>
  </g>

  <!-- Architecture Flow Diagram -->
  <!-- Central Hub: API Gateway & Modular Monolith -->
  <g transform="translate(60, 115)">
    <!-- API Gateway Box -->
    <rect x="0" y="0" width="160" height="260" rx="12" fill="#0f1b4c" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="80" y="30" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">CORE MONOLITH</text>
    <line x1="20" y1="42" x2="140" y2="42" stroke="#38bdf8" stroke-opacity="0.2"/>

    <!-- Services list inside monolith -->
    <g font-family="sans-serif" font-size="10" fill="#e2e8f0">
      <rect x="15" y="55" width="130" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
      <text x="25" y="71">🔐 Auth &amp; RBAC</text>

      <rect x="15" y="87" width="130" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
      <text x="25" y="103">📚 Content Domain</text>

      <rect x="15" y="119" width="130" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
      <text x="25" y="135">📝 Quiz &amp; Testing</text>

      <rect x="15" y="151" width="130" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
      <text x="25" y="167">🔍 Search &amp; GIN</text>

      <rect x="15" y="183" width="130" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
      <text x="25" y="199">📈 Progress Tracking</text>

      <rect x="15" y="215" width="130" height="24" rx="5" fill="#1e293b" stroke="#475569" stroke-width="0.7"/>
      <text x="25" y="231">🔔 Notification Engine</text>
    </g>
  </g>

  <!-- Interconnect Line: Monolith -> Algorithmic Engine -->
  <path d="M 220 185 L 280 185" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="280,185 272,181 272,189" fill="#38bdf8"/>

  <!-- Center-Right: Algorithms & Relational Schemas -->
  <!-- Box 1: Spaced Repetition Scheduling -->
  <g transform="translate(290, 115)">
    <rect x="0" y="0" width="230" height="120" rx="12" fill="#0d1f42" stroke="#60a5fa" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="15" y="26" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold">🧠 SPACED REPETITION ENGINE</text>
    
    <!-- Retention Curve Graph -->
    <path d="M 25 90 Q 60 50, 120 70 T 205 55" fill="none" stroke="url(#cyan-blue)" stroke-width="2.5" filter="url(#es-glow)"/>
    <circle cx="25" cy="90" r="4" fill="#38bdf8"/>
    <circle cx="120" cy="70" r="4" fill="#60a5fa"/>
    <circle cx="205" cy="55" r="4" fill="#a855f7"/>
    <text x="25" y="106" fill="#64748b" font-family="sans-serif" font-size="9">Day 1</text>
    <text x="110" y="106" fill="#64748b" font-family="sans-serif" font-size="9">Review 3</text>
    <text x="180" y="106" fill="#64748b" font-family="sans-serif" font-size="9">Retention 98%</text>
  </g>

  <!-- Box 2: PostgreSQL 10+ Entity Schema & Indexing -->
  <g transform="translate(290, 250)">
    <rect x="0" y="0" width="230" height="125" rx="12" fill="#0d1f42" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="15" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">🗄️ POSTGRESQL 10+ ENTITY SCHEMA</text>
    <text x="15" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9">Many-to-Many Mappings &amp; GIN Indexes</text>

    <!-- Schema Entities Preview -->
    <g transform="translate(15, 52)">
      <rect x="0" y="0" width="90" height="22" rx="4" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="45" y="15" text-anchor="middle" fill="#bfdbfe" font-family="monospace" font-size="9">users_auth</text>

      <rect x="105" y="0" width="90" height="22" rx="4" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="150" y="15" text-anchor="middle" fill="#bfdbfe" font-family="monospace" font-size="9">quiz_records</text>

      <rect x="0" y="30" width="90" height="22" rx="4" fill="#1e3a8a" fill-opacity="0.5" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="45" y="45" text-anchor="middle" fill="#bfdbfe" font-family="monospace" font-size="9">spaced_reps</text>

      <rect x="105" y="30" width="90" height="22" rx="4" fill="#047857" fill-opacity="0.5" stroke="#10b981" stroke-width="0.8"/>
      <text x="150" y="45" text-anchor="middle" fill="#a7f3d0" font-family="monospace" font-size="9">GIN_index (T)</text>
    </g>
  </g>

  <!-- Far Right: Redis Cache & OWASP Security -->
  <g transform="translate(540, 115)">
    <!-- Redis Cache Box -->
    <rect x="0" y="0" width="200" height="120" rx="12" fill="#200d1c" stroke="#f43f5e" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="15" y="26" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold">⚡ REDIS MEMORY CACHE</text>
    <text x="15" y="46" fill="#cbd5e1" font-family="sans-serif" font-size="10">Sub-millisecond latency</text>
    <rect x="15" y="60" width="170" height="20" rx="4" fill="#881337" fill-opacity="0.4" stroke="#f43f5e" stroke-width="0.6"/>
    <text x="25" y="74" fill="#fecdd3" font-family="monospace" font-size="9">SET session:token TTL 3600</text>
    <text x="15" y="102" fill="#fda4af" font-family="sans-serif" font-size="9 font-weight="bold">Hit Ratio: 97.4%</text>

    <!-- OWASP Security Guard Box -->
    <rect x="0" y="135" width="200" height="125" rx="12" fill="#0a2318" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <text x="15" y="161" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold">🛡️ OWASP SECURITY SRS</text>
    <text x="15" y="180" fill="#94a3b8" font-family="sans-serif" font-size="9">• Content verification FSM</text>
    <text x="15" y="198" fill="#94a3b8" font-family="sans-serif" font-size="9">• Rate limiting &amp; SQL injection guard</text>
    <text x="15" y="216" fill="#94a3b8" font-family="sans-serif" font-size="9">• Strict JWT RBAC validation</text>
    <rect x="15" y="228" width="75" height="16" rx="4" fill="#065f46" stroke="#34d399" stroke-width="0.6"/>
    <text x="52" y="239" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="8" font-weight="bold">AUDIT READY</text>
  </g>

  <!-- Bottom Spec Bar -->
  <rect x="60" y="400" width="680" height="60" rx="12" fill="#09102c" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  <text x="85" y="435" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="bold">ExamSphere</text>
  <text x="175" y="435" fill="#94a3b8" font-family="sans-serif" font-size="12">— Enterprise Scalable Backend &amp; Learning Platform Architecture</text>

  <!-- Node & Express Badges -->
  <g transform="translate(560, 417)">
    <rect x="0" y="0" width="55" height="24" rx="5" fill="#15803d" fill-opacity="0.25" stroke="#22c55e" stroke-width="0.8"/>
    <text x="27" y="16" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="10" font-weight="bold">Node.js</text>

    <rect x="62" y="0" width="55" height="24" rx="5" fill="#475569" fill-opacity="0.3" stroke="#94a3b8" stroke-width="0.8"/>
    <text x="89" y="16" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="bold">Express</text>
  </g>
</svg>
